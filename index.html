<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chat" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>Chat</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<style>
  :root {
    --bg: #ffffff;
    --bg-elev: #f2f2f7;
    --border: #e5e5ea;
    --border-strong: #d1d1d6;
    --text: #000000;
    --text-secondary: #3c3c43;
    --text-muted: #8e8e93;
    --text-faint: #b0b0b8;
    --blue: #007aff;
    --blue-pressed: #0064d1;
    --user-bubble: #5ae85d;
    --user-text: #000000;
    --assistant-bubble: #e9e9eb;
    --assistant-text: #000000;
    --composer-pill-bg: #e5e5ea;
    --header-bg: rgba(255,255,255,0.85);
    --composer-bg: rgba(255,255,255,0.94);
    --pill-bg: #ffffff;
    --pill-shadow: 0 1px 3px rgba(0,0,0,0.10), 0 6px 20px rgba(0,0,0,0.06);
    --danger: #ff3b30;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-elev: #1c1c1e;
      --border: #2c2c2e;
      --border-strong: #38383a;
      --text: #ffffff;
      --text-secondary: #e5e5ea;
      --text-muted: #8e8e93;
      --text-faint: #48484a;
      --blue: #0a84ff;
      --blue-pressed: #0066cc;
      --user-bubble: #5ae85d;
      --user-text: #000000;
      --assistant-bubble: #3a3a3c;
      --assistant-text: #ffffff;
      --composer-pill-bg: #2c2c2e;
      --header-bg: rgba(0,0,0,0.72);
      --composer-bg: rgba(0,0,0,0.94);
      --pill-bg: #2c2c2e;
      --pill-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 6px 20px rgba(0,0,0,0.4);
      --danger: #ff453a;
      color-scheme: dark;
    }
  }
  /* Manual theme overrides (win over media query in both directions) */
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-elev: #f2f2f7; --border: #e5e5ea; --border-strong: #d1d1d6;
    --text: #000000; --text-secondary: #3c3c43; --text-muted: #8e8e93; --text-faint: #b0b0b8;
    --blue: #007aff; --blue-pressed: #0064d1;
    --user-bubble: #5ae85d; --user-text: #000000;
    --assistant-bubble: #e9e9eb; --assistant-text: #000000;
    --composer-pill-bg: #e5e5ea;
    --header-bg: rgba(255,255,255,0.85); --composer-bg: rgba(255,255,255,0.94);
    --pill-bg: #ffffff;
    --pill-shadow: 0 1px 3px rgba(0,0,0,0.10), 0 6px 20px rgba(0,0,0,0.06);
    --danger: #ff3b30;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --bg-elev: #1c1c1e; --border: #2c2c2e; --border-strong: #38383a;
    --text: #ffffff; --text-secondary: #e5e5ea; --text-muted: #8e8e93; --text-faint: #48484a;
    --blue: #0a84ff; --blue-pressed: #0066cc;
    --user-bubble: #5ae85d; --user-text: #000000;
    --assistant-bubble: #3a3a3c; --assistant-text: #ffffff;
    --composer-pill-bg: #2c2c2e;
    --header-bg: rgba(0,0,0,0.72); --composer-bg: rgba(0,0,0,0.94);
    --pill-bg: #2c2c2e;
    --pill-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 6px 20px rgba(0,0,0,0.4);
    --danger: #ff453a;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family:
      -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  html, body {
    overscroll-behavior-y: none;
    /* Bleed the bg into notch/home-indicator safe zones */
    background: var(--bg);
  }
  #page {
    /* Wraps #app so wide desktop viewports get a subtle side backdrop
       instead of one lonely 520px column of white-on-white. */
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: var(--bg);
  }
  @media (min-width: 720px) {
    #page {
      background: var(--bg-elev);
    }
  }
  #app {
    display: flex;
    flex-direction: column;
    /* Use svh on iOS Safari to avoid the URL bar bouncing the composer offscreen */
    height: 100svh;
    height: 100dvh;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    /* Landscape iPhone: don't let content sit under the notch */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  @media (min-width: 720px) {
    #app {
      max-width: 720px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
  @media (min-width: 1024px) {
    #app { max-width: 760px; }
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    padding: max(env(safe-area-inset-top), 8px) 12px 10px;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 5;
  }
  .header-inner {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: flex-end;
    gap: 12px;
    min-height: 68px;
    max-width: 100%;
  }
  .icon-btn {
    width: 40px; height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--text-secondary);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .icon-btn:hover { background: var(--bg-elev); }
  .icon-btn:active { background: var(--border); }
  .icon-btn svg { width: 22px; height: 22px; }

  #menu-btn { grid-column: 1; justify-self: start; margin-right: -8px; }
  .header-identity {
    grid-column: 2 !important;
    grid-row: 1 !important;
    justify-self: center;
  }
  #header-right {
    grid-column: 3;
    justify-self: end;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-end;
    gap: 4px;
  }
  #weather-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
    line-height: 1.2;
    max-width: 220px;
  }
  #weather-chip .w-emoji { font-size: 14px; }
  #weather-chip .w-temp { font-weight: 600; color: var(--text); }
  #weather-chip .w-aqi { color: var(--text-muted); }
  #weather-chip .w-aqi.good { color: #34c759; }
  #weather-chip .w-aqi.normal { color: var(--text-secondary); }
  #weather-chip .w-aqi.bad { color: #ff9500; }
  #weather-chip .w-aqi.worst { color: var(--danger); }
  #weather-chip.loading { opacity: 0.55; }

  /* ---------- Session / token chip ---------- */
  #token-wrap { position: relative; }
  #token-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
    line-height: 1.2;
    cursor: pointer;
    user-select: none;
    font: inherit;
    font-size: 12px;
  }
  #token-chip:hover { border-color: var(--border-strong); }
  #token-chip .t-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #34c759; flex: none;
  }
  #token-chip.warn  .t-dot { background: #ff9500; }
  #token-chip.worst .t-dot { background: var(--danger); }
  #token-chip .t-time { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

  #token-pop {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 60;
    width: 232px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-secondary);
    text-align: left;
    white-space: normal;
  }
  #token-wrap.open #token-pop { display: block; }
  #token-pop .tp-title { font-weight: 600; color: var(--text); margin-bottom: 8px; }
  #token-pop .tp-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
  #token-pop .tp-row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #token-pop .tp-bar {
    height: 6px; border-radius: 999px; background: var(--bg-elev);
    overflow: hidden; margin: 8px 0 6px;
  }
  #token-pop .tp-fill { height: 100%; width: 0%; background: #34c759; transition: width .3s ease; }
  #token-pop.warn  .tp-fill { background: #ff9500; }
  #token-pop.worst .tp-fill { background: var(--danger); }
  #token-pop .tp-note {
    margin-top: 9px; padding-top: 8px;
    border-top: 1px solid var(--border);
    color: var(--text-muted); font-size: 11px;
  }
  #token-pop .tp-sync {
    margin-top: 8px; width: 100%;
    background: var(--bg-elev); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 8px; font: inherit; font-size: 11px; cursor: pointer;
  }
  #token-pop .tp-sync:hover { border-color: var(--border-strong); color: var(--text); }

  #theme-btn { width: 32px; height: 32px; }
  #theme-btn svg { width: 18px; height: 18px; }

  .header-identity {
    grid-column: 2;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    user-select: none;
  }
  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: linear-gradient(135deg, #d1d1d6, #a9a9b0);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    overflow: hidden;
    margin-bottom: 2px;
  }
  .header-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .header-name {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 2px;
    letter-spacing: -0.01em;
    max-width: 100%;
    min-width: 0;
  }
  .header-name span {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-block;
  }
  .header-name svg { width: 10px; height: 10px; color: var(--text-muted); flex-shrink: 0; }
  .header-role {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.2;
    max-width: 100%;
    padding: 0 6px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Message list ---------- */
  #messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 12px 18px 6px;
    display: flex;
    flex-direction: column;
    min-height: 0;   /* enable flex child overflow */
  }
  #messages > .spacer { flex: 1; }

  .time-sep {
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
    padding: 10px 0 4px;
    letter-spacing: 0.02em;
  }
  .time-sep b {
    color: var(--text-secondary);
    font-weight: 600;
    margin-right: 4px;
  }

  .row {
    display: flex;
    width: 100%;
    margin-top: 2px;
  }
  .row.gap { margin-top: 10px; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 75%;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 17px;
    line-height: 1.32;
    letter-spacing: -0.01em;
    word-wrap: break-word;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    min-height: 34px;
    min-width: 0;
  }
  @media (min-width: 720px) {
    .bubble { max-width: 68%; }
  }
  .bubble-images {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 4px;
    margin-bottom: 6px;
  }
  .bubble-images.solo { grid-template-columns: 1fr; }
  .bubble-images img {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    cursor: zoom-in;
  }
  .bubble-images.solo img { object-fit: contain; }
  .bubble.no-text { padding: 4px; background: transparent; }
  .bubble.no-text .bubble-images { margin-bottom: 0; }
  .bubble.user {
    background: var(--user-bubble);
    color: var(--user-text);
  }
  .bubble.assistant {
    background: var(--assistant-bubble);
    color: var(--assistant-text);
  }
  /* Typing indicator — small pill bubble hugging 3 horizontal dots.
     Overrides .bubble defaults so the shell fits exactly the dot cluster;
     the row's .tail class still supplies the classic bottom-left tail via
     the shared .row.tail .bubble.assistant::before/::after rules. */
  .bubble.assistant.empty {
    display: inline-flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 5px !important;
    width: fit-content !important;
    max-width: fit-content !important;
    min-width: 0 !important;
    min-height: 0 !important;
    padding: 10px 14px !important;
    line-height: 1 !important;
    border-radius: 22px !important;
    color: var(--text-muted);
  }
  .bubble.assistant.empty > .loading-dot {
    display: inline-block;
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: currentColor;
    opacity: 0.4;
    animation: dot 1.2s infinite ease-in-out;
    will-change: transform, opacity;
  }
  .bubble.assistant.empty > .loading-dot:nth-child(2) { animation-delay: 0.15s; }
  .bubble.assistant.empty > .loading-dot:nth-child(3) { animation-delay: 0.30s; }
  @media (prefers-reduced-motion: reduce) {
    .bubble.assistant.empty > .loading-dot { animation: none; opacity: 0.55; }
  }
  /* Slightly shorter tail for the tiny typing bubble so proportions don't look off */
  .row.tail .bubble.assistant.empty::before,
  .row.tail .bubble.assistant.empty::after {
    height: 16px;
    bottom: 0;
  }
  .row.tail .bubble.assistant.empty::before {
    width: 14px;
    left: -6px;
    border-bottom-right-radius: 14px 12px;
  }
  .row.tail .bubble.assistant.empty::after {
    width: 16px;
    left: -16px;
    border-bottom-right-radius: 10px;
  }
  /* Classic iMessage bubble tail — only on the last row of a same-sender streak */
  .row.tail .bubble {
    position: relative;
  }
  .row.tail .bubble::before,
  .row.tail .bubble::after {
    content: "";
    position: absolute;
    bottom: 0;
    height: 22px;
  }
  .row.tail .bubble.user::before {
    right: -8px;
    width: 20px;
    background: var(--user-bubble);
    border-bottom-left-radius: 18px 15px;
  }
  .row.tail .bubble.user::after {
    right: -21px;
    width: 22px;
    background: var(--bg);
    border-bottom-left-radius: 12px;
  }
  .row.tail .bubble.assistant::before {
    left: -8px;
    width: 20px;
    background: var(--assistant-bubble);
    border-bottom-right-radius: 18px 15px;
  }
  .row.tail .bubble.assistant::after {
    left: -21px;
    width: 22px;
    background: var(--bg);
    border-bottom-right-radius: 12px;
  }

  .read-receipt {
    display: block;
    text-align: right;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 6px 0 0;
    letter-spacing: -0.01em;
  }
  .read-receipt b { color: var(--text-secondary); font-weight: 500; }
  /* Don't draw a tail on image-only bubbles (they have no bg to attach to) */
  .row.tail .bubble.no-text::before,
  .row.tail .bubble.no-text::after { display: none; }
  @keyframes dot {
    0%,60%,100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 0.85; transform: translateY(-3px); }
  }

  .stop-row {
    display: flex;
    justify-content: center;
    margin: 10px 0 2px;
  }
  .stop-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--pill-bg);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--pill-shadow);
    border-radius: 999px;
    padding: 8px 14px 8px 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .stop-pill svg { width: 12px; height: 12px; }
  .tool-row {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 4px 0 2px;
    letter-spacing: -0.01em;
  }


  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    padding: 40px 24px;
    gap: 6px;
  }
  .empty p { margin: 0; font-size: 14px; }
  .empty p.sub { color: var(--text-faint); font-size: 13px; }

  .err {
    margin: 6px 12px 4px;
    background: color-mix(in srgb, var(--danger) 10%, var(--bg));
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .err button { background: none; border: 0; color: inherit; cursor: pointer; font-size: 14px; }

  /* ---------- Composer ---------- */
  footer {
    padding: 6px 12px calc(max(env(safe-area-inset-bottom), 8px) + 4px);
    background: var(--bg);
    z-index: 5;
  }
  .composer-atts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 4px 6px;
  }
  .composer-atts[hidden] { display: none; }
  .composer-att {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-elev);
    flex-shrink: 0;
  }
  .composer-att img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .composer-att .att-x {
    position: absolute;
    top: -6px; right: -6px;
    width: 20px; height: 20px;
    border-radius: 999px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    border: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  #composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .composer-plus {
    width: 36px; height: 36px;
    flex-shrink: 0;
    border-radius: 999px;
    border: 0;
    background: var(--composer-pill-bg);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    align-self: center;
  }
  .composer-plus:active { transform: scale(0.94); }
  .composer-plus svg { width: 20px; height: 20px; }
  .composer-pill {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--composer-pill-bg);
    border-radius: 999px;
    height: 36px;
    padding: 0 4px 0 14px;
    gap: 4px;
    overflow: hidden;
  }
  .composer-input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    line-height: 1.4;
    resize: none;
    padding: 8px 0;
    min-height: 22px;
    max-height: 200px;
    font-family: inherit;
    overflow-y: auto;
    overflow-x: hidden;
    white-space: normal;
    word-wrap: break-word;
    word-break: break-word;
  }
  .composer-input::placeholder { color: var(--text-muted); }
  .composer-right-btn {
    width: 28px; height: 28px;
    flex-shrink: 0;
    margin: 0;
    border: 0;
    border-radius: 999px;
    background: var(--user-bubble);
    color: var(--user-text);

    align-items: center;
    justify-content: center;

  .composer-right-btn.visible { display: inline-flex; }
  .composer-right-btn:active { transform: scale(0.92); }
  .composer-right-btn svg { width: 16px; height: 16px; }

  /* ---------- Settings modal ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;

  .backdrop.open { display: flex; }
  @media (min-width: 600px) {

  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--bg);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    border: 1px solid var(--border);
    border-bottom: 0;
    padding-bottom: max(env(safe-area-inset-bottom), 16px);

    max-height: min(92svh, 92dvh);

    flex-direction: column;

  .sheet-handle {
    width: 40px; height: 4px;

    opacity: 0.5;
    border-radius: 999px;
    margin: 8px auto 0;

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .sheet-link {
    background: none;
    border: 0;
    color: var(--blue);
    font-size: 15px;
    cursor: pointer;
    padding: 6px 4px;
  }
  .sheet-link.bold { font-weight: 600; }
  .sheet-body {
    padding: 14px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text); }
  .field .hint { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .input, .textarea, .select {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    line-height: 1.4;
  }
  .textarea { resize: vertical; min-height: 100px; }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--blue); }
  .row-split { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .link-danger { color: var(--danger); font-size: 13px; background: none; border: 0; padding: 6px 0; cursor: pointer; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .badge .dot-status { width: 6px; height: 6px; border-radius: 999px; background: var(--text-muted); }
  .badge .dot-status.on { background: #34c759; }
  .badge .dot-status.off { background: var(--danger); }

  /* ---------- Menu popover ---------- */
  #menu-pop {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 60px);
    left: 12px;
    z-index: 30;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--pill-shadow);
    padding: 6px;
    min-width: 200px;
    display: none;
  }
  #menu-pop.open { display: block; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: transparent;
    border: 0;
    width: 100%;
    text-align: left;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .menu-item:hover { background: var(--bg-elev); }
  .menu-item.danger { color: var(--danger); }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }
  .menu-humor {
    padding: 10px 12px 12px;
  }
  .menu-humor-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .menu-humor-label b { color: var(--text); font-weight: 600; font-size: 14px; }
  .menu-humor-bar {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
  }
  .menu-humor-bar button {
    height: 22px;
    border: 0;
    border-radius: 4px;
    background: var(--bg-elev);
    cursor: pointer;
    padding: 0;
    transition: background .1s ease;
  }
  .menu-humor-bar button:hover { background: var(--border); }
  .menu-humor-bar button.on {
    background: var(--blue);
  }
  .menu-humor-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* ---------- Team Modal ---------- */
  #team-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    z-index: 50;
  }
  #team-modal.open {
    display: flex;
  }
  #team-modal-content {
    width: 100%;
    max-width: 600px;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    padding: max(env(safe-area-inset-bottom), 16px) 16px 16px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp .3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  #team-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  #team-modal-header h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  .view-toggle-btn {
    background: transparent;
    border: 0;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: all .15s ease;
    border-radius: 6px;
  }
  .view-toggle-btn:hover {
    color: var(--text);
    background: var(--bg);
  }
  .view-toggle-btn.active {
    color: var(--blue);
    background: var(--bg);
  }
  .view-toggle-btn svg {
    width: 18px;
    height: 18px;
  }
  #team-modal-close {
    background: transparent;
    border: 0;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    color: var(--text-secondary);
    transition: background .15s ease;
  }
  #team-modal-close:hover {
    background: var(--bg-elev);
  }
  #team-modal-close svg {
    width: 20px;
    height: 20px;
  }
  .team-grid.list-view {
    grid-template-columns: 1fr;
  }
  .team-grid.list-view .team-card {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 12px;
    padding: 12px;
    align-items: center;
  }
  .team-grid.list-view .team-card-avatar {
    width: 60px;
    height: 60px;
    margin: 0;
    grid-column: 1;
    grid-row: 1 / span 3;
  }
  .team-grid.list-view .team-card-name {
    grid-column: 2;
    margin: 0 0 2px 0;
  }
  .team-grid.list-view .team-card-role {
    grid-column: 2;
    margin: 0 0 4px 0;
  }
  .team-grid.list-view .team-card-dept {
    grid-column: 2;
    margin: 0;
  }
  .team-grid.list-view .team-card-info {
    grid-column: 1 / -1;
    border: 0;
    padding: 0;
    margin-top: 8px;
    font-size: 12px;
  }
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .team-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    transition: all .2s ease;
  }
  .team-card:active {
    transform: scale(0.95);
    background: var(--bg);
  }
  .team-card-avatar {
    width: 80px;
    height: 80px;
    border-radius: 999px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 600;
    color: #fff;
    overflow: hidden;
  }
  .team-card-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .team-card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .team-card-role {
    font-size: 12px;
    color: var(--blue);
    margin-bottom: 4px;
  }
  .team-card-dept {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .team-card-info {
    font-size: 10px;
    color: var(--text-faint);
    line-height: 1.4;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .team-card {
    cursor: pointer;
  }
  .team-card:active {
    opacity: 0.8;
  }

  /* Team Edit Modal */
  #team-edit-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    z-index: 60;
  }
  #team-edit-modal.open {
    display: flex;
  }
  #team-edit-modal-content {
    width: 100%;
    max-width: 600px;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    padding: max(env(safe-area-inset-bottom), 16px) 16px 16px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp .3s ease;
  }
  #team-edit-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  #team-edit-modal-header h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  #team-edit-modal-close {
    background: transparent;
    border: 0;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    color: var(--text-secondary);
    transition: background .15s ease;
  }
  #team-edit-modal-close:hover {
    background: var(--bg-elev);
  }
  #team-edit-modal-close svg {
    width: 20px;
    height: 20px;
  }
  .team-edit-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: border-color .2s ease;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
  }
  .form-group textarea {
    resize: vertical;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .form-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-primary,
  .btn-secondary {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s ease;
  }
  .btn-primary {
    background: var(--blue);
    color: white;
  }
  .btn-primary:active {
    background: var(--blue-pressed);
  }
  .btn-secondary {
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:active {
    background: var(--border);
  }

  /* Avatar lightbox — tap the small circle to see the full portrait */
  #avatar-lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
    padding: 24px;
    cursor: zoom-out;
    animation: lightbox-in 0.18s ease-out;
  }
  #avatar-lightbox.open { display: flex; }
  #avatar-lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  @keyframes lightbox-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #avatar-lightbox { animation: none; }
  }

  /* ---------- Usage chip ---------- */
  #usage-wrap { position: relative; }
  #usage-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
    line-height: 1.2;
    cursor: pointer;
    user-select: none;
    font: inherit;
    font-size: 12px;
    transition: all .2s ease;
  }
  #usage-chip:hover {
    border-color: var(--border-strong);
    background: var(--bg);
  }
  #usage-chip.loading {
    opacity: 0.6;
  }
  #usage-chip .u-value {
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* Usage popover */
  #usage-pop {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 60;
    min-width: 180px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
    text-align: left;
    white-space: nowrap;
  }
  #usage-wrap.open #usage-pop { display: block; }
  #usage-pop .up-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 6px 0;
  }
  #usage-pop .up-row b {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #usage-pop .up-bar {
    height: 4px; border-radius: 999px; background: var(--bg-elev);
    overflow: hidden; margin: 4px 0 3px;
  }
  #usage-pop .up-fill {
    height: 100%; width: 0%; background: var(--text-secondary);
    transition: width .3s ease;
  }
  #usage-pop .up-fill.warn  { background: #ff9500; }
  #usage-pop .up-fill.worst { background: var(--danger); }
  #usage-pop .up-sub { font-size: 11px; color: var(--text-muted); }
  #usage-pop .up-gap { height: 10px; }
</style>

• 일정 관리: 스케줄 조율, 시간 최적화, 캘린더 운영

• 실행 지향: 즉시 실행 가능한 액션플랜 제시

  let pendingAtts = [];            // [{id, name, dataUrl, mime}]

  const READ_DELAY_MS = 200;

  /* ---------- DOM ---------- */

  const $ = (s) => document.querySelector(s);
  const messagesEl = $('#messages');
  const inputEl = $('#input');

  const composerForm = $('#composer');

  const teamModalClose = $('#team-modal-close');

  const teamEditModalClose = $('#team-edit-modal-close');
  const teamEditForm = $('#team-edit-form');
  const teamEditCancel = $('#team-edit-cancel');
  let currentEditingMemberId = null;

  const themeIcon = $('#menu-theme-icon');

  const humorBar = $('#humor-bar');
  const humorNum = $('#humor-num');
  const humorHint = $('#humor-hint');

  const headerName = $('#header-name');
  const headerRole = $('#header-role');
  const headerIdentity = $('#header-identity');

  function updateHeaderForAssistant(assistant) {
    activeAssistant = assistant;
    if (assistant.avatar) {
      headerAvatar.innerHTML = `<img src="${assistant.avatar}" alt="${assistant.name}" />`;

  // Add assistant selector
  const assistantPopover = document.createElement('div');
  assistantPopover.id = 'assistant-pop';
  assistantPopover.role = 'menu';
  assistantPopover.style.cssText = `

  const errSlot = $('#err-slot');

  const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const escAttr = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- Korean time formatting ---------- */
  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  const isSameDay = (a, b) =>
    a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  function formatTime(ts) {
    const d = new Date(ts), now = new Date();
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    const h24 = d.getHours();
    const t = `${h24 < 12 ? '오전' : '오후'} ${((h24 + 11) % 12) + 1}:${String(d.getMinutes()).padStart(2,'0')}`;
    if (isSameDay(d, now))  return { head: '오늘', time: t };
    if (isSameDay(d, yest)) return { head: '어제', time: t };
    if ((now - d) / 86400000 < 7) return { head: WEEKDAY_KO[d.getDay()] + '요일', time: t };
    return { head: `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAY_KO[d.getDay()]})`, time: t };

  function readAt(ts) {

    if (diff < 60_000) return '방금';
    if (diff < 60 * 60_000) return `${Math.floor(diff / 60_000)}분 전`;
    const d = new Date(ts), n = new Date(now);
    const same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    if (same) return '오늘';
    const y = new Date(now); y.setDate(n.getDate() - 1);
    if (d.getFullYear() === y.getFullYear() && d.getMonth() === y.getMonth() && d.getDate() === y.getDate()) return '어제';
    return `${d.getMonth()+1}월 ${d.getDate()}일`;
  }

  function renderMessages() {
    messagesEl.innerHTML = '';

    const receiptFor = (idx) => {

      if (m.role !== 'user') return null;

      if (m.createdAt - lastShownTime > 30 * 60 * 1000) {

        const sep = document.createElement('div');
        sep.className = 'time-sep';
        sep.innerHTML = `<b>${esc(t.head)}</b>${esc(t.time)}`;

        lastShownTime = m.createdAt;
        lastRole = null;
      }
      const isPendingAssistant = generating && m.id === activeAssistantId;
      /* Stop pill BETWEEN last user msg and the pending assistant reply */
      if (isPendingAssistant) {
        const stopRow = document.createElement('div');
        stopRow.className = 'stop-row';
        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'stop-pill';
        pill.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>멈춤</span>`;
        pill.addEventListener('click', stop);
        stopRow.appendChild(pill);
        messagesEl.appendChild(stopRow);
      }

      const row = document.createElement('div');
      row.className = 'row ' + m.role
        + (lastRole !== m.role ? ' gap' : '')
        + (isTail ? ' tail' : '')
        + (m.speaker ? ' speaker-' + m.speaker : '');
      const bubble = document.createElement('div');
      const hasImgs = Array.isArray(m.images) && m.images.length > 0;
      const noText = hasImgs && !m.text;
      const isEmpty = isPendingAssistant && !m.text && !hasImgs;
      bubble.className = 'bubble ' + m.role
        + (isEmpty ? ' empty' : '')
        + (noText ? ' no-text' : '');

      // Add speaker header for assistant messages (always shown; defaults to 민하 when speaker is unset)
      if (m.role === 'assistant') {
        const speaker = m.speaker === 'chaeyeon' ? ASSISTANTS.chaeyeon : ASSISTANTS.minha;
        const header = document.createElement('div');
        header.className = 'bubble-speaker-header';
        header.style.display = 'flex';
        header.style.alignItems = 'center';
        header.style.gap = '6px';
        header.style.marginBottom = '6px';
        header.style.paddingBottom = '6px';
        header.style.borderBottom = '1px solid rgba(0,0,0,0.1)';

        // Profile image element
        const profileImg = document.createElement('img');
        profileImg.src = speaker.avatar;
        profileImg.alt = speaker.name;
        profileImg.style.width = '28px';
        profileImg.style.height = '28px';
        profileImg.style.borderRadius = '50%';
        profileImg.style.objectFit = 'cover';
        profileImg.style.cursor = 'pointer';
        profileImg.style.border = `2px solid ${speaker.color}`;
        profileImg.addEventListener('click', (e) => {
          e.stopPropagation();
          $('#avatar-lightbox-img').src = speaker.avatar;
          $('#avatar-lightbox').style.display = 'flex';
        });

        // Text info
        const textInfo = document.createElement('div');
        textInfo.style.display = 'flex';
        textInfo.style.flexDirection = 'column';
        textInfo.style.gap = '1px';
        textInfo.innerHTML = `
          <strong style="color: ${speaker.color}; font-size: 13px;">${speaker.name}</strong>
          <span style="font-size: 11px; color: #999;">${speaker.role}</span>
        `;

        header.appendChild(profileImg);
        header.appendChild(textInfo);
        bubble.appendChild(header);
      }
      if (isEmpty) {
        bubble.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
      }
      if (hasImgs) {
        const imgWrap = document.createElement('div');
        imgWrap.className = 'bubble-images' + (m.images.length === 1 ? ' solo' : '');
        for (const src of m.images) {
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          img.loading = 'lazy';
          img.addEventListener('click', () => window.open(src, '_blank'));
          imgWrap.appendChild(img);
        }
        bubble.appendChild(imgWrap);
      }
      if (m.text) {
        const txt = document.createElement('div');
        txt.textContent = m.text;
        bubble.appendChild(txt);
      }
      if (isPendingAssistant) bubble.id = 'streaming-bubble';
      row.appendChild(bubble);
      messagesEl.appendChild(row);

      /* Read receipt under any user message that has been marked read */
      const rts = receiptFor(i);
      if (rts) {
        const rr = document.createElement('div');
        rr.className = 'read-receipt';
        rr.innerHTML = `<b>읽음</b>: ${esc(readAt(rts))}`;
        messagesEl.appendChild(rr);
      }

      /* Tool activity indicators ("Bash 사용 중...") below assistant bubbles */
      if (m.role === 'assistant' && Array.isArray(m.tools) && m.tools.length) {
        const isActive = isPendingAssistant;
        for (const tool of m.tools) {
          const toolRow = document.createElement('div');
          toolRow.className = 'tool-row';
          toolRow.textContent = `${tool.name} ${isActive ? '사용 중…' : '사용함'}`;
          messagesEl.appendChild(toolRow);
        }
      }

      lastRole = m.role;
    }

    requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
  }

  function updateStreamingBubble(text) {
    const el = document.getElementById('streaming-bubble');
    if (!el) return;
    /* Once real text arrives, drop empty state + remove all loading dots */
    if (text) {
      el.classList.remove('empty');
      el.querySelectorAll(':scope > .loading-dot').forEach((n) => n.remove());
    }
    let txt = el.querySelector(':scope > div:not(.bubble-images)');
    if (!txt) {
      txt = document.createElement('div');
      el.appendChild(txt);
    }
    txt.textContent = text;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderComposer() {
    const hasContent = inputEl.value.trim().length > 0 || pendingAtts.length > 0;
    sendBtn.classList.toggle('visible', hasContent && !generating);
    /* Input has fixed height (single line, scrolls horizontally). No auto-grow. */
  }

  function renderComposerAtts() {
    if (pendingAtts.length === 0) {
      attsWrap.hidden = true;
      attsWrap.innerHTML = '';
    } else {
      attsWrap.hidden = false;
      attsWrap.innerHTML = '';
      for (const a of pendingAtts) {
        const cell = document.createElement('div');
        cell.className = 'composer-att';
        const img = document.createElement('img');
        img.src = a.dataUrl;
        img.alt = a.name;
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'att-x';
        x.textContent = '✕';
        x.setAttribute('aria-label', '제거');
        x.addEventListener('click', () => {
          pendingAtts = pendingAtts.filter((p) => p.id !== a.id);
          renderComposerAtts();
          renderComposer();
        });
        cell.appendChild(img);
        cell.appendChild(x);
        attsWrap.appendChild(cell);
      }
    }
    renderComposer();
  }

  function showError(msg) {
    errSlot.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'err';
    div.innerHTML = `<span>${esc(msg)}</span><button type="button" aria-label="닫기">✕</button>`;
    div.querySelector('button').addEventListener('click', () => (errSlot.innerHTML = ''));
    errSlot.appendChild(div);
  }
  const clearError = () => (errSlot.innerHTML = '');

  /* ---------- Image downsize (client-side) ---------- */

  async function fileToCompressedDataUrl(file) {
    const maxDim = 1600;
    const rawUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('이미지를 불러올 수 없어요.'));
      i.src = rawUrl;
    });
    let { naturalWidth: w, naturalHeight: h } = img;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    if (scale < 1) { w = Math.round(w * scale); h = Math.round(h * scale); }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    return {
      dataUrl: canvas.toDataURL('image/jpeg', 0.85),
      mime: 'image/jpeg',
    };
  }

  async function addFiles(fileList) {
    const files = Array.from(fileList || []);
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      try {
        const { dataUrl, mime } = await fileToCompressedDataUrl(f);
        pendingAtts.push({
          id: Math.random().toString(36).slice(2, 10),
          name: f.name, mime, dataUrl,
        });
      } catch (e) {
        showError(`${f.name}: ${e.message}`);
      }
    }
    renderComposerAtts();
  }

  /* ---------- Server API ---------- */

  async function hydrate() {
    try {
      const r = await fetch('/state', { cache: 'no-store' });
      if (!r.ok) throw new Error(`state ${r.status}`);
      const s = await r.json();
      messages = s.messages || [];
      config = s.config || {};
      sessionId = s.sessionId || null;
      generating = !!s.generating;
      activeAssistantId = s.activeAssistantId || null;
      if (s.usage) usageState = s.usage;
      usageRender();
      /* Any user message that already has an assistant reply after it must have
         been read — seed the readMap so the receipts render on cold load. */
      for (let i = 0; i < messages.length - 1; i++) {
        const m = messages[i];
        if (m.role === 'user' && messages[i + 1]?.role === 'assistant') {
          if (!readMap.has(m.id)) readMap.set(m.id, messages[i + 1].createdAt);
        }
      }
      renderHeader();
      renderMessages();
      renderComposer();
      renderHumor();
      setServerBadge(true);
    } catch (e) {
      setServerBadge(false, e.message);
    }
  }

  async function send() {
    const text = inputEl.value.trim();
    const atts = pendingAtts.slice();
    if ((!text && atts.length === 0) || generating) return;

    /* Auto-select assistant based on message context */
    let explicitSpeaker = null;
    if (text) {
      explicitSpeaker = detectExplicitSpeaker(text);
      const selectedAssistant = selectAssistantByContext(text);
      updateHeaderForAssistant(selectedAssistant);
    }

    clearError();
    /* Optimistically clear composer; server broadcast will render the message */
    inputEl.value = '';
    pendingAtts = [];
    renderComposerAtts();
    renderComposer();
    /* Auto-nudge humor level based on this user message's tone */
    if (text) nudgeHumorFromUserMessage(text);
    /* Ask for notification permission (needs a user gesture like send) */
    maybeRequestNotifOnSend();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          prompt: text,
          speaker: activeAssistant.id,
          speakerExplicit: !!explicitSpeaker,
          attachments: atts.length
            ? atts.map((a) => ({ name: a.name, mime: a.mime, dataUrl: a.dataUrl }))
            : undefined,
        }),
      });
      if (res.status === 409) {
        inputEl.value = text; // 복원
        showError('이미 응답 중이에요. 잠시만요.');
      } else if (!res.ok) {
        inputEl.value = text; // 복원
        showError(`서버 오류 (${res.status})`);
      }
    } catch (e) {
      inputEl.value = text; // 복원
      showError(e.message || '네트워크 오류');
    }
  }

  async function stop() {
    try { await fetch('/stop', { method: 'POST' }); } catch {}
  }

  async function newChat() {
    if (generating) return;
    if (messages.length === 0 && !sessionId) return;
    if (!confirm('현재 대화를 마무리하고 새 대화를 시작할까요?')) return;
    try { await fetch('/clear', { method: 'POST' }); }
    catch (e) { showError(e.message); }
  }

  async function saveConfigPatch(patch) {
    try {
      const r = await fetch('/config', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(patch),
      });
      if (!r.ok) throw new Error(`config ${r.status}`);
    } catch (e) {
      showError('설정 저장 실패: ' + e.message);
    }
  }

  /* ---------- SSE ---------- */

  let es = null;
  function connectEvents() {
    if (es) try { es.close(); } catch {}
    es = new EventSource('/events');
    es.addEventListener('open', () => {
      setServerBadge(true);
      /* Re-hydrate on connect / reconnect to catch anything missed while offline */
      hydrate();
    });
    es.addEventListener('error', () => {
      setServerBadge(false);
      /* EventSource auto-reconnects; nothing more to do */
    });
    es.addEventListener('message', (e) => {
      let ev; try { ev = JSON.parse(e.data); } catch { return; }
      handleEvent(ev);
    });
  }

  function handleEvent(ev) {
    switch (ev.t) {
      case 'user-added': {
        messages.push(ev.message);
        renderMessages();
        renderComposer();
        /* Simulate "읽음" 200ms later — feels like the recipient just glanced */
        setTimeout(() => {
          readMap.set(ev.message.id, Date.now());
          renderMessages();
        }, READ_DELAY_MS);
        break;
      }
      case 'assistant-started': {
        messages.push(ev.message);
        activeAssistantId = ev.message.id;
        generating = true;
        renderHeader();
        renderMessages();
        renderComposer();
        break;
      }
      case 'delta': {
        const m = messages.find((x) => x.id === ev.id);
        if (m) {
          m.text += ev.text || '';
          if (m.id === activeAssistantId) updateStreamingBubble(m.text);
          else renderMessages();
        }
        break;
      }
      case 'tool': {
        const m = messages.find((x) => x.id === ev.id);
        if (m) {
          m.tools = m.tools || [];
          m.tools.push({ name: ev.tool });
          renderMessages();
        }
        break;
      }
      case 'assistant-done': {
        generating = false;
        const doneId = activeAssistantId;
        activeAssistantId = null;
        if (ev.isError) showError('응답 중 오류가 있었어요.');
        ccAddCost(ev.cost);
        if (ev.usage) {
          usageState = ev.usage;
          usageRender();
        }
        /* Update session info display */
        updateSessionInfo();
        renderHeader();
        renderMessages();
        renderComposer();
        /* Fire notification (only when tab not focused) */
        const doneMsg = messages.find((m) => m.id === doneId);
        if (doneMsg?.text) notifyAssistantReply(doneMsg.text);
        break;
      }
      case 'session': {
        sessionId = ev.sessionId;
        renderComposer();
        break;
      }
      case 'generating': {
        generating = !!ev.on;
        renderHeader();
        renderComposer();
        break;
      }
      case 'cleared': {
        messages = [];
        sessionId = null;
        generating = false;
        activeAssistantId = null;
        readMap.clear();
        clearError();
        renderHeader();
        renderMessages();
        renderComposer();
        break;
      }
      case 'config': {
        config = ev.config;
        renderHeader();
        renderHumor();
        break;
      }
      case 'error': {
        showError(ev.message || '알 수 없는 오류');
        break;
      }
      case 'retry': {
        /* silent */
        break;
      }
      case 'usage-updated': {
        if (ev.usage) {
          usageState = ev.usage;
          usageRender();
        }
        break;
      }
    }
  }

  function setServerBadge(ok, msg) {
    if (!serverDot) return;
    if (ok) {
      serverDot.className = 'dot-status on';
      serverStatus.textContent = '서버 연결됨 (실시간 동기화)';
    } else {
      serverDot.className = 'dot-status off';
      serverStatus.textContent = '서버 오프라인' + (msg ? ` — ${msg}` : '');
    }
  }

  /* ---------- Settings sheet ---------- */

  function openSettings() {
    if (!config) return;
    sInput.name.value = config.name || '';
    sInput.role.value = config.role || '';
    sInput.avatar.value = config.avatarUrl || '';
    sInput.model.value = config.model || 'sonnet';
    sInput.system.value = config.systemPrompt || '';
    settingsBackdrop.classList.add('open');
  }
  function closeSettings() { settingsBackdrop.classList.remove('open'); }
  async function saveSettings() {
    const patch = {
      name: sInput.name.value.trim(),
      role: sInput.role.value.trim(),
      avatarUrl: sInput.avatar.value.trim(),
      model: sInput.model.value,
      systemPrompt: sInput.system.value.trim(),
    };
    await saveConfigPatch(patch);
    closeSettings();
  }
  async function wipeAll() {
    if (!confirm('모든 대화 기록과 세션을 삭제할까요?')) return;
    try { await fetch('/clear', { method: 'POST' }); } catch {}
    closeSettings();
  }

  /* ---------- Wire ---------- */

  composerForm.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  inputEl.addEventListener('input', () => {
    renderComposer();
    // Real-time speaker detection while typing
    const text = inputEl.value.trim();
    if (text) {
      const selectedAssistant = selectAssistantByContext(text);
      updateHeaderForAssistant(selectedAssistant);
    }
  });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('paste', (e) => {
    const items = Array.from(e.clipboardData?.items || []);
    const files = items
      .filter((it) => it.kind === 'file' && it.type.startsWith('image/'))
      .map((it) => it.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
  plusBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    addFiles(e.target.files);
    e.target.value = '';
  });
  ['dragover', 'drop'].forEach((k) =>
    document.addEventListener(k, (e) => e.preventDefault()));
  document.addEventListener('drop', (e) => {
    const files = Array.from(e.dataTransfer?.files || [])
      .filter((f) => f.type.startsWith('image/'));
    if (files.length) addFiles(files);
  });
  /* Header identity click → OPEN LIGHTBOX (see the face big).
     Settings now lives in the hamburger menu, so this doesn't compete. */
  const avatarLightbox = $('#avatar-lightbox');
  const avatarLightboxImg = $('#avatar-lightbox-img');
  function openAvatarLightbox() {
    if (!config?.avatarUrl) { openSettings(); return; }  // no picture set → fallback to settings
    avatarLightboxImg.src = config.avatarUrl;
    avatarLightbox.classList.add('open');
  }
  function closeAvatarLightbox() {
    avatarLightbox.classList.remove('open');
  }
  headerIdentity.addEventListener('click', openAvatarLightbox);
  headerIdentity.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAvatarLightbox(); }
  });
  avatarLightbox.addEventListener('click', closeAvatarLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && avatarLightbox.classList.contains('open')) closeAvatarLightbox();
  });
  settingsBackdrop.addEventListener('click', (e) => {
    if (e.target === settingsBackdrop) closeSettings();
  });
  $('#settings-cancel').addEventListener('click', closeSettings);
  $('#settings-save').addEventListener('click', saveSettings);
  $('#wipe-btn').addEventListener('click', wipeAll);

  /* ---------- Session window / token chip ----------
   * 5시간 롤링 창은 claude.ai · Claude Code CLI · 이 앱이 함께 쓰는 값이라
   * 이 앱 혼자서는 정확한 시작 시각을 알 수 없다. 그래서 초기화 시각을
   * 한 번 기준점으로 잡아 저장해두고(아래 SEED / "다시 맞추기" 버튼),
   * 거기서 카운트다운한다. 비용은 서버가 assistant-done에 실어주는
   * total_cost_usd 를 창 단위로 누적한 값 — 이 앱에서 쓴 몫만 반영된다.
   */
  const CC_WINDOW_MS = 5 * 60 * 60 * 1000;
  const CC_LIMIT_USD = 3.50;
  const CC_SEED_END  = new Date('2026-08-24T01:01:00+09:00').getTime();
  const CC_K_END = 'cc_window_end';
  const CC_K_COST = 'cc_window_cost';

  const tokenWrap = $('#token-wrap');
  const tokenChip = $('#token-chip');
  const tokenPop  = $('#token-pop');

  const usageWrap = $('#usage-wrap');
  const usageChip = $('#usage-chip');
  const usagePop = $('#usage-pop');

  let usageState = {
    totalCostUsd: 0,
    sessionCostUsd: 0,
    lastUpdatedAt: null,
    fiveHour: { utilization: 0, resetsAt: 0 },
    sevenDay: { utilization: 0, resetsAt: 0 },
  };
  let usageFetching = false;

  const ccNum = (k, d) => { const v = Number(localStorage.getItem(k)); return Number.isFinite(v) && v > 0 ? v : d; };
  const ccFmtClock = (ts) => new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  const ccFmtDur = (ms) => {
    const t = Math.max(0, Math.floor(ms / 1000));
    return `${Math.floor(t / 3600)}시간 ${String(Math.floor(t % 3600 / 60)).padStart(2, '0')}분`;
  };

  let ccEnd  = ccNum(CC_K_END, CC_SEED_END);
  let ccCost = Number(localStorage.getItem(CC_K_COST)) || 0;

  function ccSetEnd(ts) {
    ccEnd = ts;
    localStorage.setItem(CC_K_END, String(ts));
  }
  function ccSetCost(v) {
    ccCost = v;
    localStorage.setItem(CC_K_COST, String(v));
  }

  /* 서버가 알려준 실제 비용 누적. 창이 지났으면 새 창을 연다. */
  function ccAddCost(usd) {
    if (!Number.isFinite(usd) || usd <= 0) return;
    if (Date.now() >= ccEnd) { ccSetEnd(Date.now() + CC_WINDOW_MS); ccSetCost(0); }
    ccSetCost(ccCost + usd);
    ccRender();
  }

  function ccRender() {
    if (!tokenChip) return;
    const now = Date.now();
    const left = ccEnd - now;
    const expired = left <= 0;
    const pct = Math.max(0, Math.min(100, (ccCost / CC_LIMIT_USD) * 100));

    const t = Math.max(0, Math.floor(left / 1000));
    tokenChip.querySelector('.t-time').textContent =
      expired ? '초기화됨' : `${Math.floor(t / 3600)}:${String(Math.floor(t % 3600 / 60)).padStart(2, '0')}`;

    const level = expired ? '' : left < 30 * 60_000 ? 'worst' : left < 60 * 60_000 ? 'warn' : '';
    tokenChip.classList.remove('warn', 'worst');
    tokenPop.classList.remove('warn', 'worst');
    if (level) { tokenChip.classList.add(level); tokenPop.classList.add(level); }
    tokenChip.title = expired
      ? '세션 창이 지났어요 · 다음 메시지부터 새 창'
      : `${ccFmtDur(left)} 뒤 초기화 (${ccFmtClock(ccEnd)})`;

    $('#tp-remain').textContent  = expired ? '초기화됨' : ccFmtDur(left);
    $('#tp-at').textContent      = ccFmtClock(ccEnd);
    $('#tp-elapsed').textContent = expired ? '--' : ccFmtDur(CC_WINDOW_MS - left);
    $('#tp-cost').textContent    = `$${ccCost.toFixed(2)}`;
    $('#tp-fill').style.width    = `${pct}%`;
    $('#tp-note').textContent = expired
      ? '창이 지났어요. 다음 메시지를 보내면 새 5시간 창이 시작돼요.'
      : '5시간 창은 claude.ai·CLI와 함께 쓰는 값이라, 사용분은 이 앱에서 쓴 몫만 집계돼요.';
  }

  if (tokenChip) {
    const ccClose = () => { tokenWrap.classList.remove('open'); tokenChip.setAttribute('aria-expanded', 'false'); };
    tokenChip.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = tokenWrap.classList.toggle('open');
      tokenChip.setAttribute('aria-expanded', String(open));
    });
    tokenWrap.addEventListener('mouseenter', () => { tokenWrap.classList.add('open'); });
    tokenWrap.addEventListener('mouseleave', () => { if (document.activeElement !== tokenChip) ccClose(); });
    tokenPop.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', ccClose);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ccClose(); });

    $('#tp-sync').addEventListener('click', () => {
      const raw = prompt('claude.ai 기준 남은 시간을 넣어주세요 (예: 1:46 또는 106)', '');
      if (raw == null) return;
      const s = raw.trim();
      const m = /^(\d+)\s*:\s*(\d{1,2})$/.exec(s);
      const mins = m ? Number(m[1]) * 60 + Number(m[2]) : Number(s);
      if (!Number.isFinite(mins) || mins <= 0 || mins > 300) { alert('0~300분 사이로 넣어주세요. 예: 1:46'); return; }
      ccSetEnd(Date.now() + mins * 60_000);
      ccRender();
    });

    ccRender();
    setInterval(ccRender, 1000);
  }

  /* ---------- Usage tracking ---------- */

  /* resetsAt (unix seconds) → "2시간 후" / "1일 후" 같은 문구 */
  function fmtResetsIn(resetsAtSec) {
    if (!resetsAtSec) return '--';
    const leftMs = resetsAtSec * 1000 - Date.now();
    if (leftMs <= 0) return '초기화됨';
    const mins = Math.floor(leftMs / 60_000);
    if (mins < 60) return `${mins}분 후 재설정`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}시간 ${mins % 60}분 후 재설정`;
    return `${Math.floor(hours / 24)}일 ${hours % 24}시간 후 재설정`;
  }

  function fillLevel(el, pct) {
    if (!el) return;
    el.style.width = `${Math.max(0, Math.min(100, pct))}%`;
    el.classList.remove('warn', 'worst');
    if (pct >= 90) el.classList.add('worst');
    else if (pct >= 70) el.classList.add('warn');
  }

  function usageRender() {
    if (!usageChip) return;
    const p5 = Math.round((usageState.fiveHour?.utilization || 0) * 100);
    const p7 = Math.round((usageState.sevenDay?.utilization || 0) * 100);

    /* 헤더 칩: 5시간 세션 사용률 */
    usageChip.querySelector('.u-value').textContent = `${p5}%`;

    /* 팝오버: 5시간 / 7일 */
    const el5 = $('#up-5h-pct'), el7 = $('#up-7d-pct');
    if (el5) el5.textContent = `${p5}%`;
    if (el7) el7.textContent = `${p7}%`;
    fillLevel($('#up-5h-fill'), p5);
    fillLevel($('#up-7d-fill'), p7);
    const r5 = $('#up-5h-reset'), r7 = $('#up-7d-reset');
    if (r5) r5.textContent = fmtResetsIn(usageState.fiveHour?.resetsAt);
    if (r7) r7.textContent = fmtResetsIn(usageState.sevenDay?.resetsAt);
  }

  /* 팝오버 열려있는 동안 남은 시간만 갱신 */
  const updateSessionInfo = usageRender;

  async function fetchUsageAuto() {
    if (usageFetching || !usageChip) return;
    usageFetching = true;
    usageChip.classList.add('loading');

    try {
      const r = await fetch('/api/usage/fetch', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      if (data.ok && data.usage) {
        usageState = data.usage;
        usageRender();
      }
    } catch (e) {
      console.error('[usage-fetch] error:', e.message);
    } finally {
      usageFetching = false;
      usageChip.classList.remove('loading');
    }
  }

  if (usageChip) {
    const usageClose = () => {
      usageWrap.classList.remove('open');
      usageChip.setAttribute('aria-expanded', 'false');
    };

    /* 클릭 시 팝오버 토글 + 데이터 가져오기 */
    usageChip.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = usageWrap.classList.toggle('open');
      usageChip.setAttribute('aria-expanded', String(open));
      if (open) {
        fetchUsageAuto();
        updateSessionInfo();
        /* 팝오버 열려있는 동안 1초마다 세션 정보 업데이트 */
        if (!usageChip._sessionUpdateInterval) {
          usageChip._sessionUpdateInterval = setInterval(() => {
            if (usageWrap.classList.contains('open')) {
              updateSessionInfo();
            }
          }, 1000);
        }
      }
    });

    /* 호버 시 데이터 가져오기 */
    let hoverTimeout = null;
    usageChip.addEventListener('mouseenter', () => {
      hoverTimeout = setTimeout(() => fetchUsageAuto(), 500);
    });
    usageChip.addEventListener('mouseleave', () => {
      if (hoverTimeout) clearTimeout(hoverTimeout);
    });

    /* 외부 클릭으로 닫기 */
    usagePop.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', usageClose);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') usageClose();
    });

    usageRender();
  }

  /* ---------- Theme toggle (per-device localStorage) ---------- */

  const THEME_ICONS = {
    dark:  'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
    light: 'M12 4v2M12 18v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z',
  };
  function currentTheme() {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeIcon.innerHTML = `<path d="${THEME_ICONS[t]}"/>`;
    themeIcon.setAttribute('fill', t === 'dark' ? 'currentColor' : 'none');
    if (themeLabel) themeLabel.textContent = t === 'dark' ? '라이트 모드' : '다크 모드';
    /* Update the browser chrome color meta for iOS PWA */
    const meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (!meta) {
      const m = document.createElement('meta');
      m.name = 'theme-color';
      m.content = t === 'dark' ? '#000000' : '#ffffff';
      document.head.appendChild(m);
    } else {
      meta.content = t === 'dark' ? '#000000' : '#ffffff';
    }
  }
  applyTheme(currentTheme());
  themeBtn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  /* ---------- Menu popover ---------- */

  function openMenu() {
    if (typeof refreshNotifLabel === 'function') refreshNotifLabel();
    menuPop.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    menuPop.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuPop.classList.contains('open') ? closeMenu() : openMenu();
  });
  document.addEventListener('click', (e) => {
    if (!menuPop.contains(e.target) && e.target !== menuBtn) closeMenu();
  });

  /* Team Modal */
  function renderTeamGrid() {
    teamGrid.className = 'team-grid list-view';
    teamGrid.innerHTML = TEAM_MEMBERS.map(member => `
      <div class="team-card" data-member-id="${member.id}">
        <div class="team-card-avatar">
          ${member.avatar ? `<img src="${member.avatar}" alt="${member.name}" />` : member.name[0]}
        </div>
        <div class="team-card-name">${member.name}</div>
        <div class="team-card-role">${member.role}</div>
        <div class="team-card-dept">${member.department}</div>
        <div class="team-card-info">
          <div><strong>입사:</strong> ${member.joinDate}</div>
          <div style="margin-top: 8px;"><strong>AI 모델:</strong> ${member.model}</div>
          <div style="margin-top: 8px; padding: 8px; background: #f5f5f5; border-radius: 6px; font-size: 12px; line-height: 1.6; white-space: pre-wrap;">
            <strong>역할 및 지침:</strong>
${member.guidelines}
          </div>
        </div>
      </div>
    `).join('');

    // Add click listeners to team cards
    document.querySelectorAll('.team-card').forEach(card => {
      card.addEventListener('click', () => {
        const memberId = parseInt(card.dataset.memberId);
        openTeamEditModal(memberId);
      });
    });
  }
  function openTeamModal() {
    renderTeamGrid();
    teamModal.classList.add('open');
  }
  function closeTeamModal() {
    teamModal.classList.remove('open');
  }
  function openTeamEditModal(memberId) {
    const member = TEAM_MEMBERS.find(m => m.id === memberId);
    if (!member) return;

    currentEditingMemberId = memberId;
    $('#team-edit-name').textContent = member.name;
    $('#edit-model').value = member.model || '';
    $('#edit-department').value = member.department;
    $('#edit-guidelines').value = member.guidelines;
    teamEditModal.classList.add('open');
  }
  function closeTeamEditModal() {
    teamEditModal.classList.remove('open');
    currentEditingMemberId = null;
  }
  teamBtn.addEventListener('click', openTeamModal);
  teamModalClose.addEventListener('click', closeTeamModal);
  teamEditModalClose.addEventListener('click', closeTeamEditModal);
  teamEditCancel.addEventListener('click', closeTeamEditModal);
  teamEditForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const member = TEAM_MEMBERS.find(m => m.id === currentEditingMemberId);
    if (member) {
      member.model = $('#edit-model').value;
      member.department = $('#edit-department').value;
      member.guidelines = $('#edit-guidelines').value;
    }
    closeTeamEditModal();
    renderTeamGrid();
  });
  teamModal.addEventListener('click', (e) => {
    if (e.target === teamModal) closeTeamModal();
  });
  teamEditModal.addEventListener('click', (e) => {
    if (e.target === teamEditModal) closeTeamEditModal();
  });
  $('#menu-new').addEventListener('click', () => { closeMenu(); newChat(); });
  $('#menu-settings').addEventListener('click', () => { closeMenu(); openSettings(); });
  $('#menu-wipe').addEventListener('click', () => { closeMenu(); wipeAll(); });

  /* Header profile interactions */
  headerAvatar.style.cursor = 'pointer';
  headerAvatar.addEventListener('click', () => {
    // Show the current active assistant's profile image
    if (activeAssistant && activeAssistant.avatar) {
      $('#avatar-lightbox-img').src = activeAssistant.avatar;
      $('#avatar-lightbox').style.display = 'flex';
    }
  });

  $('#avatar-lightbox').addEventListener('click', (e) => {
    if (e.target === $('#avatar-lightbox') || e.target === $('#avatar-lightbox-img')) {
      $('#avatar-lightbox').style.display = 'none';
    }
  });

  /* Header name — speaker selector disabled (탭해서 화자 수동 변경 불가, 자동 감지만 사용) */

  /* Notification permission — request or explain based on current state */
  const menuNotifBtn = $('#menu-notif');
  const menuNotifLabel = $('#menu-notif-label');
  function refreshNotifLabel() {
    if (typeof Notification === 'undefined') {
      menuNotifLabel.textContent = '알림 (지원 안 됨)';
      menuNotifBtn.disabled = true;
      return;
    }
    const p = Notification.permission;
    if (p === 'granted') menuNotifLabel.textContent = '알림 켜짐 ✓';
    else if (p === 'denied') menuNotifLabel.textContent = '알림 차단됨 — 브라우저 설정에서 허용';
    else menuNotifLabel.textContent = '알림 켜기';
  }
  refreshNotifLabel();
  menuNotifBtn.addEventListener('click', async () => {
    closeMenu();
    if (typeof Notification === 'undefined') return;
    const p = Notification.permission;
    if (p === 'granted') {
      /* Test notification so user sees it actually works */
      try {
        new Notification(config?.name || '민하', {
          body: '알림 테스트 — 잘 뜨네요.',
          icon: config?.avatarUrl || '/icon-192.png',
          tag: 'chat-test',
        });
      } catch (e) {
        showError('알림을 표시할 수 없어요: ' + e.message);
      }
    } else if (p === 'denied') {
      showError('알림이 차단됐어요. 주소 표시줄 왼쪽 자물쇠 → 알림 → 허용으로 바꿔주세요. (iOS는 홈 화면에 추가 후 앱을 열어야 알림이 활성화됩니다.)');
    } else {
      const ok = await ensureNotificationPermission();
      refreshNotifLabel();
      if (ok) {
        try {
          new Notification(config?.name || '민하', {
            body: '알림이 켜졌습니다.',
            icon: config?.avatarUrl || '/icon-192.png',
            tag: 'chat-welcome',
          });
        } catch {}
      }
    }
  });

  /* ---------- Humor level (1-10) ---------- */

  const HUMOR_HINTS = {
    1: '순수 사무적 — 존댓말, 이모지·유머 없음',
    2: '사무적 — 존댓말, 감정 최소',
    3: '정중·실무적 (기본)',
    4: '정중하고 편안한 존댓말',
    5: '친근한 존댓말',
    6: '캐주얼 존댓말, 가벼운 농담',
    7: '반존대, 친구 같은 편안함',
    8: '주로 반말, 이모지 많이',
    9: '반말, 친한 친구 톤',
    10: '완전 반말, 개그 톤 😜',
  };
  function renderHumor() {
    const level = (config && config.humorLevel) || 3;
    humorNum.textContent = String(level);
    humorHint.textContent = HUMOR_HINTS[level] || '';
    /* Build bar buttons once */
    if (humorBar.children.length !== 10) {
      humorBar.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.level = String(i);
        b.title = `${i}: ${HUMOR_HINTS[i]}`;
        b.addEventListener('click', () => saveConfigPatch({ humorLevel: i }));
        humorBar.appendChild(b);
      }
    }
    /* Fill "on" state up to current level */
    for (const b of humorBar.children) {
      const lv = Number(b.dataset.level);
      b.classList.toggle('on', lv <= level);
    }
  }

  /* ---------- Client-side tone heuristic (auto-nudge humor level) ---------- */

  function detectToneScore(text) {
    // Returns 1-10 based on formality signals. Higher = more casual.
    if (!text) return null;
    const casualHits =
      (text.match(/[ㅋㅎㅠㅜ]{1,}/g) || []).length * 2 +
      (text.match(/\b(야|어|해|하자|간다|가자|맞아|그래|응|ㅇㅇ|ㄴㄴ|ㄱㄱ)\b/g) || []).length * 1 +
      (text.match(/[\p{Extended_Pictographic}]/gu) || []).length * 1 +
      (text.match(/(!!+|\?\?+|~+)/g) || []).length * 1;
    const formalHits =
      (text.match(/(요|습니다|입니다|해주세요|드립니다|께서|드려요|합니다)/g) || []).length * 1.5 +
      (text.match(/(부탁|검토|확인|요청|바랍니다|주시기 바랍니다|제안)/g) || []).length * 1;
    const raw = casualHits - formalHits;
    // Map [-4..+4] roughly to [1..10]
    const score = Math.max(1, Math.min(10, Math.round(5.5 + raw)));
    return score;
  }
  function nudgeHumorFromUserMessage(text) {
    const detected = detectToneScore(text);
    if (!detected || !config) return;
    const cur = config.humorLevel || 3;
    // Only nudge when detected drifts materially from current, and only by 1
    const gap = detected - cur;
    if (Math.abs(gap) < 2) return;
    const next = cur + Math.sign(gap);
    saveConfigPatch({ humorLevel: next });
  }

  /* ---------- Weather + AQI (Open-Meteo, no API key) ---------- */

  const WMO_EMOJI = (code) => {
    if (code === 0) return '☀️';
    if ([1,2,3].includes(code)) return '⛅';
    if ([45,48].includes(code)) return '🌫️';
    if ([51,53,55,56,57].includes(code)) return '🌦️';
    if ([61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
    if ([71,73,75,77,85,86].includes(code)) return '❄️';
    if ([95,96,99].includes(code)) return '⛈️';
    return '🌡️';
  };
  function aqiGrade(pm25, pm10) {
    // Korean grade: max of both pollutants' grades
    const g25 = pm25 == null ? 0 : pm25 <= 15 ? 1 : pm25 <= 35 ? 2 : pm25 <= 75 ? 3 : 4;
    const g10 = pm10 == null ? 0 : pm10 <= 30 ? 1 : pm10 <= 80 ? 2 : pm10 <= 150 ? 3 : 4;
    const g = Math.max(g25, g10);
    return ['--', '좋음', '보통', '나쁨', '매우나쁨'][g] || '--';
  }
  function aqiClass(label) {
    if (label === '좋음') return 'good';
    if (label === '보통') return 'normal';
    if (label === '나쁨') return 'bad';
    if (label === '매우나쁨') return 'worst';
    return '';
  }

  async function getCoords() {
    // Try geolocation; fallback to Seoul.
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve({ lat: 37.5665, lon: 126.9780, src: 'default' });
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, src: 'geo' }),
        () => resolve({ lat: 37.5665, lon: 126.9780, src: 'default' }),
        { timeout: 5000, maximumAge: 3600_000, enableHighAccuracy: false },
      );
    });
  }

  let weatherTimer = null;
  async function refreshWeather() {
    try {
      weatherChip.classList.add('loading');
      const { lat, lon } = await getCoords();
      const [wRes, aRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`).then(r=>r.json()),
        fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5`).then(r=>r.json()),
      ]);
      const temp = wRes?.current?.temperature_2m;
      const code = wRes?.current?.weather_code;
      const pm25 = aRes?.current?.pm2_5;
      const pm10 = aRes?.current?.pm10;
      const label = aqiGrade(pm25, pm10);
      weatherChip.querySelector('.w-emoji').textContent = WMO_EMOJI(code);
      weatherChip.querySelector('.w-temp').textContent = (temp != null ? `${Math.round(temp)}°` : '--°');
      const aqiEl = weatherChip.querySelector('.w-aqi');
      aqiEl.textContent = label;
      aqiEl.className = 'w-aqi ' + aqiClass(label);
      weatherChip.classList.remove('loading');
      weatherChip.title = `${WMO_EMOJI(code)} 기온 ${Math.round(temp)}° · 미세먼지 ${label} (PM2.5 ${pm25 ?? '?'} / PM10 ${pm10 ?? '?'})`;
    } catch (e) {
      weatherChip.classList.remove('loading');
      weatherChip.querySelector('.w-emoji').textContent = '⚠️';
      weatherChip.querySelector('.w-temp').textContent = '--°';
      weatherChip.querySelector('.w-aqi').textContent = 'off';
      weatherChip.title = '날씨 정보를 못 가져왔어요: ' + (e.message || e);
    }
    /* Refresh every 10 minutes */
    clearTimeout(weatherTimer);
    weatherTimer = setTimeout(refreshWeather, 10 * 60_000);
  }

  /* ---------- Notifications (Web Notifications API) ---------- */

  function canNotify() {
    return typeof Notification !== 'undefined' && Notification.permission === 'granted';
  }
  async function ensureNotificationPermission() {
    if (typeof Notification === 'undefined') return false;
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') return false;
    try {
      const p = await Notification.requestPermission();
      return p === 'granted';
    } catch { return false; }
  }
  function tabIsFocused() {
    return typeof document !== 'undefined' && document.visibilityState === 'visible' && document.hasFocus();
  }
  function notifyAssistantReply(text) {
    if (!canNotify()) return;
    if (tabIsFocused()) return;   // don't disturb if user is already looking
    const preview = (text || '').slice(0, 140).replace(/\s+/g, ' ').trim();
    if (!preview) return;
    try {
      const n = new Notification(config?.name || '메시지', {
        body: preview,
        icon: config?.avatarUrl || '/icon-192.png',
        badge: '/icon-192.png',
        tag: 'chat-reply',
        renotify: true,
        silent: false,
      });
      n.onclick = () => { window.focus(); n.close(); };
      setTimeout(() => { try { n.close(); } catch {} }, 15_000);
    } catch { /* silent — some browsers throw when tab focused */ }
  }
  /* Ask for permission on first user send (browsers require a user gesture) */
  let didAskNotifPermission = false;
  async function maybeRequestNotifOnSend() {
    if (didAskNotifPermission) return;
    didAskNotifPermission = true;
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      await ensureNotificationPermission();
    }
  }

  /* ---------- Boot ---------- */

  hydrate();
  connectEvents();
  updateHeaderForAssistant(activeAssistant);
  refreshWeather();

  /* Reconnect SSE when page becomes visible again (mobile Safari) */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (!es || es.readyState === 2 /* CLOSED */) connectEvents();
      else hydrate();
    }
  });

})();

</script>
</body>
